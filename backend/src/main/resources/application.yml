# ============================================================
# Douyin Web Demo — 应用配置
# ============================================================

server:
  port: 8080

spring:
  application:
    name: douyin-backend

  # 数据源配置（Docker 部署时通过环境变量覆盖）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/douyin?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}

  # Redis 配置（Docker 部署时通过环境变量覆盖）
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
      password:
      database: 0
      timeout: 3000ms

  # 文件上传大小限制
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

# MyBatis Plus 配置
mybatis-plus:
  # 实体类所在的包
  type-aliases-package: com.douyin.entity
  # 逻辑删除
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    # 下划线转驼峰
    map-underscore-to-camel-case: true
    # 日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath*:/mapper/**/*.xml

# JWT 配置（Docker 部署时通过环境变量覆盖）
jwt:
  secret: ${JWT_SECRET:douyin-demo-jwt-secret-key-2026-must-be-at-least-256-bits-long}
  expiration: ${JWT_EXPIRATION:604800000}  # 7天，单位毫秒

# MinIO 配置（Docker 部署时通过环境变量覆盖）
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:douyin}

# 自定义配置
douyin:
  ffmpeg:
    path: ${DOUYIN_FFMPEG_PATH:D:/APP/ffmpeg/bin/ffmpeg.exe}

# 日志
logging:
  level:
    com.douyin: debug
