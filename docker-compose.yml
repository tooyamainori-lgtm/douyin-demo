# ============================================================
# Douyin Web Demo — Docker Compose
# 一键启动：MySQL + Redis + MinIO + Backend + Frontend
#
# 启动：docker compose up -d
# 停止：docker compose down
# 重建：docker compose up -d --build
# ============================================================

services:

  # ========== 数据库 ==========
  mysql:
    image: mysql:8.0
    container_name: douyin-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: douyin
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docs/database.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ========== 缓存 ==========
  redis:
    image: redis:7-alpine
    container_name: douyin-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ========== 对象存储 ==========
  minio:
    image: minio/minio:latest
    container_name: douyin-minio
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ========== 后端 ==========
  backend:
    build: ./backend
    container_name: douyin-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/douyin?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_DATA_REDIS_HOST: redis
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: douyin
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ========== 前端 ==========
  frontend:
    build: ./frontend
    container_name: douyin-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

# ========== 数据卷 ==========
volumes:
  mysql-data:
  redis-data:
  minio-data:
